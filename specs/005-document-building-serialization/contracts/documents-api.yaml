openapi: 3.0.3
info:
  title: Documents API
  version: 0.1.0
  description: |
    Draft document authoring, server-side recompute, local validation against
    004-cached document type version, and canonical preview. No ETA submission.
servers:
  - url: /api
paths:
  /documents:
    get:
      summary: List documents (drafts and ready)
      operationId: listDocuments
      tags: [documents]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, READY]
        - name: kind
          in: query
          schema:
            $ref: '#/components/schemas/DocumentKind'
      responses:
        '200':
          description: Document summaries
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DocumentSummary'
        '401':
          description: Unauthorized
        '403':
          description: Missing documents.view
    post:
      summary: Create draft document
      operationId: createDocument
      tags: [documents]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentUpsertRequest'
      responses:
        '201':
          description: Created draft (totals recomputed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDetail'
        '400':
          description: Validation / referential error
        '403':
          description: Missing documents.manage

  /documents/{id}:
    get:
      summary: Get document with payload and optional canonical
      operationId: getDocument
      tags: [documents]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDetail'
        '404':
          description: Not found
    put:
      summary: Update draft (recomputes totals; resets READY → DRAFT)
      operationId: updateDocument
      tags: [documents]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentUpsertRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDetail'
        '409':
          description: Stale version (optimistic concurrency)
    delete:
      summary: Delete draft/document
      operationId: deleteDocument
      tags: [documents]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '204':
          description: Deleted
        '403':
          description: Missing documents.manage

  /documents/{id}/preview:
    post:
      summary: Build ETA JSON + canonical string without persisting
      operationId: previewDocument
      tags: [documents]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentUpsertRequest'
      responses:
        '200':
          description: Live preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPreview'

  /documents/preview:
    post:
      summary: Preview unsaved document body
      operationId: previewUnsavedDocument
      tags: [documents]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentUpsertRequest'
      responses:
        '200':
          description: Live preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPreview'

  /documents/{id}/validate:
    post:
      summary: Local validation against cached type-version schema
      operationId: validateDocument
      tags: [documents]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'

  /documents/{id}/mark-ready:
    post:
      summary: Mark READY if validation passes
      operationId: markDocumentReady
      tags: [documents]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Marked ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDetail'
        '400':
          description: Validation failed — remains DRAFT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'

components:
  parameters:
    TenantHeader:
      name: X-Tenant-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
    DocumentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    DocumentKind:
      type: string
      enum:
        - INVOICE
        - CREDIT_NOTE
        - DEBIT_NOTE
        - EXPORT_INVOICE
        - EXPORT_CREDIT_NOTE
        - EXPORT_DEBIT_NOTE

    DocumentStatus:
      type: string
      enum: [DRAFT, READY]

    MoneyString:
      type: string
      description: Decimal string; monetary amounts use exactly 2 fractional digits
      example: "10.00"

    DocumentSummary:
      type: object
      required: [id, kind, status, internalId, issueDateTime, totalAmount, currencyCode, updatedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/DocumentKind' }
        status: { $ref: '#/components/schemas/DocumentStatus' }
        internalId: { type: string }
        issueDateTime: { type: string, format: date-time }
        currencyCode: { type: string }
        totalAmount: { $ref: '#/components/schemas/MoneyString' }
        updatedAt: { type: string, format: date-time }

    DocumentLineInput:
      type: object
      required: [description, itemType, itemCode, unitType, quantity, unitPrice]
      properties:
        description: { type: string }
        itemType: { type: string }
        itemCode: { type: string }
        unitType: { type: string }
        quantity: { type: string }
        unitPrice: { $ref: '#/components/schemas/MoneyString' }
        discountRate: { type: string }
        discountAmount: { $ref: '#/components/schemas/MoneyString' }
        taxes:
          type: array
          items:
            type: object
            required: [taxType, subType, rate]
            properties:
              taxType: { type: string }
              subType: { type: string }
              rate: { type: string }

    DocumentUpsertRequest:
      type: object
      required: [kind, branchId, currencyCode, issueDateTime, internalId, lines, version]
      properties:
        kind: { $ref: '#/components/schemas/DocumentKind' }
        branchId: { type: string, format: uuid }
        currencyCode: { type: string }
        issueDateTime: { type: string, format: date-time }
        internalId: { type: string }
        version:
          type: integer
          description: Optimistic concurrency token (0 on create)
        receiver:
          type: object
          additionalProperties: true
        references:
          type: object
          description: Original document reference for notes
          additionalProperties: true
        extraDiscountAmount: { $ref: '#/components/schemas/MoneyString' }
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/DocumentLineInput' }
        # Client-supplied totals MUST be ignored by the server

    DocumentDetail:
      type: object
      required:
        - id
        - kind
        - status
        - branchId
        - currencyCode
        - issueDateTime
        - internalId
        - etaDocumentType
        - etaDocumentTypeVersion
        - lines
        - totals
        - etaPayload
        - version
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/DocumentKind' }
        status: { $ref: '#/components/schemas/DocumentStatus' }
        branchId: { type: string, format: uuid }
        currencyCode: { type: string }
        exchangeRate: { type: string, nullable: true }
        issueDateTime: { type: string, format: date-time }
        internalId: { type: string }
        etaDocumentType: { type: string }
        etaDocumentTypeVersion: { type: string }
        lines:
          type: array
          items:
            type: object
            additionalProperties: true
        totals:
          type: object
          required: [totalSalesAmount, totalDiscountAmount, netAmount, totalAmount]
          properties:
            totalSalesAmount: { $ref: '#/components/schemas/MoneyString' }
            totalDiscountAmount: { $ref: '#/components/schemas/MoneyString' }
            netAmount: { $ref: '#/components/schemas/MoneyString' }
            totalAmount: { $ref: '#/components/schemas/MoneyString' }
            extraDiscountAmount: { $ref: '#/components/schemas/MoneyString' }
            taxTotals:
              type: array
              items:
                type: object
                required: [taxType, amount]
                properties:
                  taxType: { type: string }
                  amount: { $ref: '#/components/schemas/MoneyString' }
        etaPayload:
          type: object
          description: Ordered ETA document JSON (input to canonicalSerialize)
          additionalProperties: true
        canonicalString:
          type: string
          description: Result of canonicalSerialize(etaPayload)
        version: { type: integer }

    DocumentPreview:
      type: object
      required: [etaPayload, canonicalString, totals]
      properties:
        etaPayload:
          type: object
          additionalProperties: true
        canonicalString: { type: string }
        totals:
          type: object
          additionalProperties: true

    ValidationIssue:
      type: object
      required: [code, path, severity, message]
      properties:
        code: { type: string }
        path: { type: string }
        severity:
          type: string
          enum: [error, warning]
        message: { type: string }

    ValidationResult:
      type: object
      required: [ok, issues]
      properties:
        ok: { type: boolean }
        issues:
          type: array
          items: { $ref: '#/components/schemas/ValidationIssue' }
