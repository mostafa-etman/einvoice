# Production stack for Hostinger VPS (2 vCPU / 8GB RAM).
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# Does NOT replace infra/docker-compose.yml (local dev).
#
# TLS / reverse proxy: uses the shared host Traefik (traefik-oygi-traefik-1),
# NOT a Traefik service in this compose. Web + API join footballmanager_default
# (same Docker network as football-manager) so host-mode Traefik can reach them
# by container IP; they also stay on einvoice-prod for postgres/redis/minio.
# Published 8080/8081 are for direct debugging only.

name: einvoice-prod

services:
  postgres:
    image: postgres:16-alpine
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-einvoice_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-prod:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - einvoice-prod
    mem_limit: 1024m
    # Not published to host — only reachable on the Docker network.

  redis:
    image: redis:7-alpine
    platform: linux/amd64
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - einvoice-prod
    mem_limit: 384m

  minio:
    image: minio/minio:latest
    platform: linux/amd64
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - einvoice-prod
    mem_limit: 512m

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      platforms:
        - linux/amd64
    image: einvoice-api:prod
    platform: linux/amd64
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      PORT: 3001
      APP_ROLE: api
      DATABASE_URL: ${DATABASE_URL}
      MIGRATE_DATABASE_URL: ${MIGRATE_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_USE_SSL: "false"
      MINIO_BUCKET: ${MINIO_BUCKET:-einvoice}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # Published for direct debugging (fbm owns :3000). Traefik uses shared-network IP.
    ports:
      - "8081:3001"
    labels:
      - traefik.enable=true
      # Prefer shared-network IP when container is on multiple networks
      - traefik.docker.network=footballmanager_default
      - traefik.http.routers.eta-api.entrypoints=websecure
      - traefik.http.routers.eta-api.rule=Host(`api.eta.erp-esafe.com`)
      - traefik.http.routers.eta-api.tls=true
      - traefik.http.routers.eta-api.tls.certresolver=letsencrypt
      - traefik.http.services.eta-api.loadbalancer.server.port=3001
    networks:
      - einvoice-prod
      - traefik-shared
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/health/live"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      platforms:
        - linux/amd64
    image: einvoice-api:prod
    platform: linux/amd64
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      PORT: 3001
      APP_ROLE: worker
      DATABASE_URL: ${DATABASE_URL}
      MIGRATE_DATABASE_URL: ${MIGRATE_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_USE_SSL: "false"
      MINIO_BUCKET: ${MINIO_BUCKET:-einvoice}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - einvoice-prod
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/health/live"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      platforms:
        - linux/amd64
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_DEFAULT_LOCALE: ${NEXT_PUBLIC_DEFAULT_LOCALE:-ar}
    image: einvoice-web:prod
    platform: linux/amd64
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      - api
    # Published for direct debugging (fbm owns :3000). Traefik uses shared-network IP.
    ports:
      - "8080:3000"
    labels:
      - traefik.enable=true
      # Prefer shared-network IP when container is on multiple networks
      - traefik.docker.network=footballmanager_default
      - traefik.http.routers.eta-web.entrypoints=websecure
      - traefik.http.routers.eta-web.rule=Host(`eta.erp-esafe.com`)
      - traefik.http.routers.eta-web.tls=true
      - traefik.http.routers.eta-web.tls.certresolver=letsencrypt
      - traefik.http.services.eta-web.loadbalancer.server.port=3000
    networks:
      - einvoice-prod
      - traefik-shared
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

networks:
  einvoice-prod:
    name: einvoice-prod
    driver: bridge
  # Same network football-manager uses — host-mode Traefik can reach it
  traefik-shared:
    external: true
    name: footballmanager_default

volumes:
  postgres_data:
    name: einvoice_prod_postgres
  minio_data:
    name: einvoice_prod_minio
  redis_data:
    name: einvoice_prod_redis
